service: hc-chatbot

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    WHATSAPP_VERIFY_TOKEN: ${env:WHATSAPP_VERIFY_TOKEN}
    WHATSAPP_ACCESS_TOKEN: ${env:WHATSAPP_ACCESS_TOKEN}
    WHATSAPP_PHONE_NUMBER_ID: ${env:WHATSAPP_PHONE_NUMBER_ID}
    MONGODB_URI: ${env:MONGODB_URI}
    MONGODB_DB_NAME: ${env:MONGODB_DB_NAME}
    ANALYTICS_API_URL: ${env:ANALYTICS_API_URL}
    ANALYTICS_API_KEY: ${env:ANALYTICS_API_KEY}
    STAGE: ${self:provider.stage}

functions:
  # ─── Lambda 1: Chatbot WhatsApp ───────────────────────────────────────────
  webhook:
    handler: src/handlers/webhook.handler
    description: Recibe y procesa mensajes de WhatsApp via Meta Cloud API
    events:
      - http:
          path: /webhook
          method: get
          cors: true
      - http:
          path: /webhook
          method: post
          cors: true
    timeout: 30

  # ─── Lambda 2: Dashboard y reportes ──────────────────────────────────────
  dashboard:
    handler: src/handlers/dashboard.handler
    description: KPIs, historial de conversaciones y filtros para el panel admin
    events:
      - http:
          path: /dashboard/stats
          method: get
          cors: true
      - http:
          path: /dashboard/conversations
          method: get
          cors: true
      - http:
          path: /dashboard/conversations/{userId}
          method: get
          cors: true
    timeout: 30

  # ─── Lambda 3: Carga de datos y envios masivos ────────────────────────────
  campaigns:
    handler: src/handlers/campaigns.handler
    description: Carga de CSV/Excel de egresados y envio masivo de mensajes WhatsApp
    events:
      - http:
          path: /campaigns/upload
          method: post
          cors: true
      - http:
          path: /campaigns/egresados
          method: get
          cors: true
      - http:
          path: /campaigns/send
          method: post
          cors: true
    timeout: 60

plugins:
  - serverless-offline
